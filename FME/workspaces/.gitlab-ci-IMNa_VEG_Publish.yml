stages:           # List of stages for jobs, and their order of execution
  - build

build-new_dev-veg-publish:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for dev..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VEG_Publish.ps1 D:\GitLab-Deployments\IMNa\FME\properties\dev.properties $FME_TOKEN_NEW_DEV}
    - echo "END - Deployment complete."

  environment:
    name: development

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_VEG_Publish.fsproject
        - FME/properties/IMNa_VEG_Publish_Dev.xml
        - FME/scripts/IMNa_VEG_Publish.ps1
        - FME/xslts/IMNa_VEG_Publish.xslt
        - FME/workspaces/IMNa_VEG_Publish/*
        - FME/workspaces/.gitlab-ci-IMNa_VEG_Publish.yml
      when: manual


build-new_test-veg-publish:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for test..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VEG_Publish.ps1 D:\GitLab-Deployments\IMNa\FME\properties\test.properties $FME_TOKEN_NEW_TEST}
    - echo "END - Deployment complete."

  environment:
    name: test

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_VEG_Publish.fsproject
        - FME/properties/IMNa_VEG_Publish_Test.xml
        - FME/scripts/IMNa_VEG_Publish.ps1
        - FME/xslts/IMNa_VEG_Publish.xslt
        - FME/workspaces/IMNa_VEG_Publish/*
        - FME/workspaces/.gitlab-ci-IMNa_VEG_Publish.yml
      when: manual

#This is for acc
build-new_acc-veg-publish:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for acc..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VEG_Publish.ps1 D:\GitLab-Deployments\IMNa\FME\properties\acc.properties $FME_TOKEN_NEW_ACC}
    - echo "END - Deployment complete."

  environment:
    name: acceptance
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-NDVH$/'
      when: manual


build-new_prod-veg-publish:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for prod..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VEG_Publish.ps1 D:\GitLab-Deployments\IMNa\FME\properties\prod.properties $FME_TOKEN_NEW_PROD}
    - echo "END - Deployment complete."

  environment:
    name: production
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-NDVH$/'
      when: manual
