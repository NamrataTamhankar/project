stages:           # List of stages for jobs, and their order of execution
  - build

build-new-dev-ikn-wfs-validation:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for FME Flow dev..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_IKN_WFS_Validation.ps1 D:\GitLab-Deployments\IMNa\FME\properties\dev.properties $FME_TOKEN_NEW_DEV}
    - echo "END - Deployment complete."

  environment:
    name: development

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_IKN_WFS_Validation.fsproject
        - FME/properties/IMNa_IKN_WFS_Validation_Dev.xml
        - FME/scripts/IMNa_IKN_WFS_Validation.ps1
        - FME/xslts/IMNa_IKN_WFS_Validation.xslt
        - FME/workspaces/IMNa_IKN/*
        - FME/workspaces/.gitlab-ci-IMNa_IKN_WFS_Validation.yml
      when: manual

build-new-test-ikn-wfs-validation:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for test..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_IKN_WFS_Validation.ps1 D:\GitLab-Deployments\IMNa\FME\properties\test.properties $FME_TOKEN_NEW_TEST}
    - echo "END - Deployment complete."

  environment:
    name: test

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_IKN_WFS_Validation.fsproject
        - FME/properties/IMNa_IKN_WFS_Validation_Test.xml
        - FME/scripts/IMNa_IKN_WFS_Validation.ps1
        - FME/xslts/IMNa_IKN_WFS_Validation.xslt
        - FME/workspaces/IMNa_IKN/*
        - FME/workspaces/.gitlab-ci-IMNa_IKN_WFS_Validation.yml
      when: manual

build-acc-ikn-wfs-validation:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for acc..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_IKN_WFS_Validation.ps1 D:\GitLab-Deployments\IMNa\FME\properties\acc.properties $FME_TOKEN_NEW_ACC}
    - echo "END - Deployment complete."

  environment:
    name: acceptance
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-IKN$/'
      when: manual


build-prod-ikn-wfs-validation:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for prod..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_IKN_WFS_Validation.ps1
     D:\GitLab-Deployments\IMNa\FME\properties\prod.properties $FME_TOKEN_NEW_PROD}
    - echo "END - Deployment complete."

  environment:
    name: production
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-IKN$/'
      when: manual
