stages:           # List of stages for jobs, and their order of execution
  - deploy

build-dev-generic-customTransformers:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for FME Flow dev..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_Generic_CustomTransformers.ps1 D:\GitLab-Deployments\IMNa\FME\properties\dev.properties $FME_TOKEN_NEW_DEV}
    - echo "END - Deployment complete."

  environment:
    name: development

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/scripts/IMNa_Generic_CustomTransformers.ps1
        - FME/workspaces/IMNa_Generic/*
        - FME/workspaces/IMNa_CustomTransformers/*
        - FME/workspaces/.gitlab-ci-IMNa_Generic_CustomTransformers.yml
      when: manual


build-new-test-generic-customTransformers:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for test..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_Generic_CustomTransformers.ps1 D:\GitLab-Deployments\IMNa\FME\properties\test.properties $FME_TOKEN_NEW_TEST}
    - echo "END - Deployment complete."

  environment:
    name: test

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/scripts/IMNa_Generic_CustomTransformers.ps1
        - FME/workspaces/IMNa_Generic/*
        - FME/workspaces/IMNa_CustomTransformers/*
        - FME/workspaces/.gitlab-ci-IMNa_Generic_CustomTransformers.yml
      when: manual

#This is for Acceptance environment
build-acc-generic-customTransformers:
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for acc..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_Generic_CustomTransformers.ps1 D:\GitLab-Deployments\IMNa\FME\properties\acc.properties $FME_TOKEN_NEW_ACC}
    - echo "END - Deployment complete."

  environment:
    name: acceptance

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-GENERIC_2024$/'
      when: manual

