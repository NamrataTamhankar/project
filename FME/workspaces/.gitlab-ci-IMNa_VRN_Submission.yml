stages:           # List of stages for jobs, and their order of execution
  - build
build-new-dev-vrn-submission:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for dev..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VRN_Submission.ps1 D:\GitLab-Deployments\IMNa\FME\properties\dev.properties $FME_TOKEN_NEW_DEV}
    - echo "END - Deployment complete."

  environment:
    name: development

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_VRN_Submission.fsproject
        - FME/properties/IMNa_VRN_Submission_Dev.xml
        - FME/scripts/IMNa_VRN_Submission.ps1
        - FME/xslts/IMNa_VRN_Submission.xslt
        - FME/workspaces/IMNa_VRN/*
        - FME/workspaces/.gitlab-ci-IMNa_VRN_Submission.yml
      when: manual

build-new-test-vrn-submission:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for test..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VRN_Submission.ps1 D:\GitLab-Deployments\IMNa\FME\properties\test.properties $FME_TOKEN_NEW_TEST}
    - echo "END - Deployment complete."

  environment:
    name: test

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - FME/projects/IMNa_VRN_Submission.fsproject
        - FME/properties/IMNa_VRN_Submission_Test.xml
        - FME/scripts/IMNa_VRN_Submission.ps1
        - FME/xslts/IMNa_VRN_Submission.xslt
        - FME/workspaces/IMNa_VRN/*
        - FME/workspaces/.gitlab-ci-IMNa_VRN_Submission.yml
      when: manual

build-acc-vrn-submission:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for acc..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VRN_Submission.ps1 D:\GitLab-Deployments\IMNa\FME\properties\acc.properties $FME_TOKEN_NEW_ACC}
    - echo "END - Deployment complete."

  environment:
    name: acceptance
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-SNL$/'
      when: manual


build-prod-vrn-submission:        # This job runs in the build stage, which runs first.
  stage: build

  cache: null

  script:
    - echo "BEGIN - Deploying the code for prod..."
    - if (Test-Path $IMNa_PATH\FME) { Remove-Item $IMNa_PATH\FME -Force -Recurse }
    - cp -R FME $IMNa_PATH\FME
    - Invoke-Command -ScriptBlock { D:\GitLab-Deployments\IMNa\FME\scripts\IMNa_VRN_Submission.ps1 D:\GitLab-Deployments\IMNa\FME\properties\prod.properties $FME_TOKEN_NEW_PROD}
    - echo "END - Deployment complete."

  environment:
    name: production
    
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+-SNL$/'
      when: manual
